[project]
name = "vulfi-mcp"
version = "0.1.0"
description = "VulFi vulnerability-hunting rules for the official Hex-Rays IDA MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ida-mcp==20260924.0.3",
    "ida-nexus==0.13.0",
    "ida-domain==0.5.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vulfi_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
